<div class="pb-28 pt-8 animate-fade-in px-4 relative min-h-[80vh] flex flex-col">
    <button onclick="switchPage('profile')" class="absolute top-4 right-4 w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 text-[#0f172a] hover:bg-gray-50 transition z-10">
        <i data-lucide="arrow-right" class="w-5 h-5"></i>
    </button>
    <div class="flex justify-center mb-8 mt-4">
        <div class="text-center">
            <h1 class="text-3xl font-black text-[#0f172a] tracking-wide">ألك</h1>
            <span class="text-[8px] text-gold-500 font-black tracking-[0.3em] uppercase block -mt-1">ALAK</span>
        </div>
    </div>

    <div id="phoneStep" class="flex-1 flex flex-col">
        <h2 class="text-2xl font-black text-[#0f172a] mb-2">تسجيل الدخول</h2>
        <p class="text-[11px] text-gray-500 font-bold mb-8 leading-relaxed">أدخل رقم هاتفك للمتابعة. سنقوم بإرسال رمز تحقق (OTP) لتأكيد هويتك.</p>
        <div class="bg-white rounded-2xl border-2 border-gray-100 p-2 flex items-center shadow-sm mb-8 rtl:flex-row-reverse">
            <div class="px-3 border-l border-gray-100 flex items-center gap-2" dir="ltr">
                <span class="text-lg">🇮🇶</span> <span class="text-sm font-black text-[#0f172a] mt-1">+964</span>
            </div>
            <input type="tel" id="phoneNumber" placeholder="7X XX XXX XXX" class="w-full bg-transparent outline-none px-3 text-lg font-black text-[#0f172a] placeholder-gray-300 text-left" dir="ltr" maxlength="11">
        </div>
        <button onclick="sendOTP()" class="mt-auto w-full bg-gold-400 text-[#0f172a] font-black text-sm py-4 rounded-2xl shadow-lg shadow-gold-400/30 hover:scale-[1.02] active:scale-95 transition-transform flex items-center justify-center gap-2">
            <span>إرسال رمز التحقق</span> <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </button>
    </div>

    <div id="otpStep" class="hidden flex-1 flex flex-col">
        <h2 class="text-2xl font-black text-[#0f172a] mb-2">أدخل الرمز</h2>
        <p class="text-[11px] text-gray-500 font-bold mb-8 leading-relaxed">
            تم إرسال رمز مكون من 6 أرقام إلى <br>
            <span id="displayPhone" class="text-[#0f172a] font-black" dir="ltr"></span>
            <button onclick="editPhone()" class="text-gold-500 underline mr-2">تعديل</button>
        </p>
        <div class="flex justify-between gap-2 mb-8" dir="ltr">
            <input type="tel" maxlength="1" class="otp-input w-12 h-14 bg-white border-2 border-gray-100 rounded-xl text-center text-xl font-black text-[#0f172a]">
            <input type="tel" maxlength="1" class="otp-input w-12 h-14 bg-white border-2 border-gray-100 rounded-xl text-center text-xl font-black text-[#0f172a]">
            <input type="tel" maxlength="1" class="otp-input w-12 h-14 bg-white border-2 border-gray-100 rounded-xl text-center text-xl font-black text-[#0f172a]">
            <input type="tel" maxlength="1" class="otp-input w-12 h-14 bg-white border-2 border-gray-100 rounded-xl text-center text-xl font-black text-[#0f172a]">
            <input type="tel" maxlength="1" class="otp-input w-12 h-14 bg-white border-2 border-gray-100 rounded-xl text-center text-xl font-black text-[#0f172a]">
            <input type="tel" maxlength="1" class="otp-input w-12 h-14 bg-white border-2 border-gray-100 rounded-xl text-center text-xl font-black text-[#0f172a]">
        </div>
        <div class="text-center mb-6">
            <p class="text-[11px] font-bold text-gray-500">لم يصلك الرمز؟ <button onclick="showToast('تمت إعادة إرسال الرمز')" class="text-[#0f172a] font-black hover:text-gold-500">إعادة إرسال</button></p>
        </div>
        <button onclick="verifyOTP()" class="mt-auto w-full bg-[#0f172a] text-white font-black text-sm py-4 rounded-2xl shadow-lg shadow-black/20 hover:scale-[1.02] active:scale-95 transition-transform">
            تأكيد وتسجيل الدخول
        </button>
    </div>
</div>
