<div class="pb-28 animate-fade-in relative min-h-screen">
    <div class="absolute inset-0 bg-gray-100 z-0 h-[65vh]">
        <div class="w-full h-full bg-[url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=800&auto=format&fit=crop')] bg-cover bg-center opacity-40"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#f4f7fb]/80 to-[#f4f7fb]"></div>
    </div>

    <div class="relative z-10 pt-6 px-4">
        <div class="bg-white/90 backdrop-blur-md rounded-3xl p-4 shadow-lg border border-white flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center border-2 border-white shadow-sm">
                    <img src="/assets/taxi-icon.svg" class="w-6 h-6 object-contain" alt="Car">
                </div>
                <div>
                    <h2 class="text-sm font-black text-[#0f172a]" id="dash-driver-name">كابتن ألك</h2>
                    <p class="text-[10px] font-bold text-gray-500">جاهز لاستلام الطلبات</p>
                </div>
            </div>
            <div class="flex flex-col items-center">
                <label class="relative inline-flex items-center cursor-pointer mb-1">
                    <input type="checkbox" id="driverStatusToggle" class="sr-only peer" checked onchange="toggleDriverStatus(this)">
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500 shadow-inner"></div>
                </label>
                <span id="driver-status-text" class="text-[9px] font-black text-blue-600">متاح للعمل</span>
            </div>
        </div>
    </div>

    <div class="relative z-10 px-4 mt-4 grid grid-cols-2 gap-3">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center shrink-0">
                <i data-lucide="banknote" class="w-5 h-5 text-emerald-500"></i>
            </div>
            <div>
                <p class="text-[10px] font-bold text-gray-400 mb-0.5">أرباح اليوم</p>
                <p class="text-sm font-black text-[#0f172a]">25,000 <span class="text-[8px] text-gray-500 font-bold">د.ع</span></p>
            </div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-purple-50 flex items-center justify-center shrink-0">
                <i data-lucide="navigation" class="w-5 h-5 text-purple-500"></i>
            </div>
            <div>
                <p class="text-[10px] font-bold text-gray-400 mb-0.5">الرحلات المكتملة</p>
                <p class="text-sm font-black text-[#0f172a]">4 <span class="text-[8px] text-gray-500 font-bold">رحلات</span></p>
            </div>
        </div>
    </div>

    <div id="searching-radar" class="relative z-10 mt-16 flex flex-col items-center justify-center">
        <div class="relative w-40 h-40 flex items-center justify-center">
            <div class="absolute inset-0 bg-blue-400/20 rounded-full animate-ping"></div>
            <div class="absolute inset-4 bg-blue-400/20 rounded-full animate-ping" style="animation-delay: 0.3s"></div>
            <div class="absolute inset-8 bg-blue-400/20 rounded-full animate-ping" style="animation-delay: 0.6s"></div>
            <div class="relative w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(59,130,246,0.3)] border-4 border-blue-50 z-20">
                <i data-lucide="radar" class="w-6 h-6 text-blue-500 animate-spin-slow"></i>
            </div>
        </div>
        <h3 class="mt-6 text-lg font-black text-[#0f172a]" id="radar-title">جاري البحث عن ركاب...</h3>
        <p class="text-xs font-bold text-gray-500 mt-1" id="radar-desc">خليك قريب من المناطق المزدحمة للحصول على طلبات أسرع</p>
    </div>
</div>
