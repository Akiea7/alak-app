<div class="pb-28 pt-6 px-4 animate-fade-in space-y-5">
    <h2 class="text-xl font-black text-[#0f172a] mb-2">المحفظة والأرباح</h2>

    <div class="bg-gradient-to-br from-blue-600 to-blue-800 rounded-[2rem] p-6 text-white shadow-xl shadow-blue-500/20 relative overflow-hidden">
        <i data-lucide="wallet" class="absolute -left-4 -bottom-4 w-32 h-32 text-white opacity-10 -rotate-12"></i>
        
        <div class="relative z-10">
            <p class="text-xs font-bold text-blue-100 mb-1">الرصيد الكلي المتاح</p>
            <h3 class="text-3xl font-black mb-6">125,000 <span class="text-sm font-bold text-blue-200">د.ع</span></h3>
            
            <button onclick="showToast('سيتم تحويل أرباحك إلى حساب زين كاش الخاص بك قريباً')" class="w-full bg-white text-blue-600 font-black py-3.5 rounded-2xl shadow-lg hover:scale-[1.02] active:scale-95 transition flex justify-center items-center gap-2">
                <i data-lucide="arrow-down-to-line" class="w-4 h-4"></i>
                <span class="text-xs">سحب الأرباح (زين كاش)</span>
            </button>
        </div>
    </div>

    <h3 class="text-sm font-black text-[#0f172a] mt-6 mb-3">ملخص هذا الأسبوع</h3>
    <div class="grid grid-cols-2 gap-3">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <i data-lucide="trending-up" class="w-5 h-5 text-emerald-500 mb-2"></i>
            <p class="text-[10px] font-bold text-gray-400 mb-1">صافي الدخل</p>
            <p class="text-sm font-black text-[#0f172a]">65,000 <span class="text-[8px] text-gray-400">د.ع</span></p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <i data-lucide="navigation" class="w-5 h-5 text-blue-500 mb-2"></i>
            <p class="text-[10px] font-bold text-gray-400 mb-1">عدد الرحلات</p>
            <p class="text-sm font-black text-[#0f172a]">12 <span class="text-[8px] text-gray-400">رحلة</span></p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <i data-lucide="clock" class="w-5 h-5 text-purple-500 mb-2"></i>
            <p class="text-[10px] font-bold text-gray-400 mb-1">ساعات العمل</p>
            <p class="text-sm font-black text-[#0f172a]">14 <span class="text-[8px] text-gray-400">ساعة</span></p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <i data-lucide="star" class="w-5 h-5 text-gold-400 mb-2"></i>
            <p class="text-[10px] font-bold text-gray-400 mb-1">تقييم الزبائن</p>
            <p class="text-sm font-black text-[#0f172a]">4.9 <span class="text-[8px] text-gray-400">/ 5.0</span></p>
        </div>
    </div>
</div>
