<div class="pb-28 pt-6 px-4 animate-fade-in space-y-4">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-black text-[#0f172a]">الطلبات المتاحة</h2>
        <span class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-blue-500"></span>
        </span>
    </div>

    <div class="bg-white rounded-3xl p-4 shadow-sm border border-blue-100 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-1.5 h-full bg-blue-500"></div>
        
        <div class="flex justify-between items-start mb-4">
            <div>
                <p class="text-xs font-black text-[#0f172a]">طلب توصيل (تكسي)</p>
                <p class="text-[10px] font-bold text-gray-400 mt-0.5">يبعد عنك 1.2 كم • دقيقتين</p>
            </div>
            <div class="text-left">
                <p class="text-lg font-black text-blue-600">4,500 <span class="text-[8px] text-gray-500">د.ع</span></p>
                <p class="text-[9px] font-bold text-emerald-500 bg-emerald-50 px-2 py-0.5 rounded-md inline-block">دفع نقدي</p>
            </div>
        </div>

        <div class="space-y-3 mb-5 px-2 relative">
            <div class="absolute right-4 top-2 bottom-2 w-px border-r-2 border-dashed border-gray-200"></div>
            
            <div class="flex items-center gap-4 relative z-10">
                <div class="w-3 h-3 rounded-full border-[3px] border-blue-500 bg-white"></div>
                <span class="text-[11px] font-bold text-gray-600">شارع 60، تقاطع المركز</span>
            </div>
            <div class="flex items-center gap-4 relative z-10">
                <i data-lucide="map-pin" class="w-4 h-4 text-[#0f172a] -ml-0.5"></i>
                <span class="text-[11px] font-black text-[#0f172a]">السوق الرئيسي</span>
            </div>
        </div>

        <div class="flex gap-2">
            <button onclick="showToast('تم قبول الطلب! توجه للراكب 🚗', 'success')" class="flex-1 bg-blue-500 text-white font-black py-3 rounded-2xl shadow-lg shadow-blue-500/30 text-xs hover:scale-[1.02] active:scale-95 transition">قبول الطلب</button>
            <button onclick="showToast('تم رفض الطلب', 'error')" class="px-5 bg-gray-50 text-gray-500 font-bold py-3 rounded-2xl border border-gray-200 text-xs hover:bg-gray-100 transition">تجاهل</button>
        </div>
    </div>
</div>
