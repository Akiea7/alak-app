<div class="pb-28 pt-4 animate-fade-in space-y-5 px-2">
    <div class="flex items-center gap-3 mb-2 px-2">
        <button onclick="switchPage('profile')" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 text-[#0f172a] hover:bg-gray-50 transition">
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
        <h2 class="text-xl font-black text-[#0f172a]">الإعدادات</h2>
    </div>

    <div class="bg-white rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden divide-y divide-gray-50">
        <div class="flex items-center justify-between p-5">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center">
                    <i data-lucide="moon" class="w-5 h-5 text-slate-600"></i>
                </div>
                <div>
                    <span class="block text-sm font-black text-[#0f172a]">الوضع الداكن</span>
                    <span class="block text-[10px] text-gray-400 font-bold mt-0.5">تغيير مظهر التطبيق</span>
                </div>
            </div>
            <button onclick="toggleTheme()" class="w-12 h-6 bg-gray-200 rounded-full relative transition-colors duration-300" id="themeToggleBtn">
                <div class="w-5 h-5 bg-white rounded-full absolute top-0.5 right-0.5 shadow-sm transition-transform duration-300"></div>
            </button>
        </div>

        <button onclick="showToast('سيتم إضافة اللغة الإنجليزية قريباً')" class="w-full flex items-center justify-between p-5 hover:bg-gray-50 transition">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center">
                    <i data-lucide="globe" class="w-5 h-5 text-blue-500"></i>
                </div>
                <div class="text-right">
                    <span class="block text-sm font-black text-[#0f172a]">لغة التطبيق</span>
                    <span class="block text-[10px] text-gray-400 font-bold mt-0.5">العربية</span>
                </div>
            </div>
            <i data-lucide="chevron-left" class="w-5 h-5 text-gray-300"></i>
        </button>

        <div class="flex items-center justify-between p-5">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center">
                    <i data-lucide="bell" class="w-5 h-5 text-orange-500"></i>
                </div>
                <div>
                    <span class="block text-sm font-black text-[#0f172a]">تنبيهات التطبيق</span>
                    <span class="block text-[10px] text-gray-400 font-bold mt-0.5">العروض وحالة الرحلة</span>
                </div>
            </div>
            <button class="w-12 h-6 bg-gold-400 rounded-full relative transition-colors duration-300">
                <div class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 shadow-sm transition-transform duration-300"></div>
            </button>
        </div>
    </div>
</div>
