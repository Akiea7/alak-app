<div class="pb-28 pt-4 animate-fade-in space-y-6 px-1">
    
    <div class="relative bg-gradient-to-br from-[#fff9e6] to-white rounded-[2rem] p-6 overflow-hidden shadow-[0_8px_30px_rgba(0,0,0,0.05)] border border-gray-100 min-h-[190px] flex items-center">
        <div class="absolute inset-0 opacity-40 bg-[radial-gradient(circle_at_top_right,_#f5b800_0%,_transparent_50%)] pointer-events-none"></div>

        <div class="relative z-10 w-[65%]">
            <div class="inline-flex items-center gap-1.5 bg-gold-400/20 text-gold-600 px-3 py-1 rounded-full text-[9px] font-black mb-3">
                <span class="w-1.5 h-1.5 rounded-full bg-gold-500 animate-pulse"></span>
                جاهزون لخدمتك
            </div>

            <h2 class="text-2xl font-black text-[#0f172a] leading-tight mb-1.5">
                تنقل بكل <br>
                سهولة <span class="text-gold-500">وأمان</span>
            </h2>

            <p class="text-[9px] text-gray-500 font-bold mb-4 leading-relaxed">
                أطلب تكسي الآن ووصل لوجهتك بسرعة
            </p>

            <button onclick="scrollToBooking()" class="bg-gold-400 text-[#0f172a] font-black px-5 py-2.5 rounded-xl flex items-center gap-2 shadow-lg shadow-gold-400/30 hover:scale-105 transition-transform">
                <span class="text-[11px]">طلب تكسي</span>
                <img src="/assets/taxi-icon.svg" class="w-5 h-5 object-contain" alt="Taxi Icon">
            </button>
        </div>

        <img src="/assets/taxi.png" class="absolute bottom-0 -left-8 w-[260px] object-contain drop-shadow-2xl z-0" alt="Taxi">
    </div>

    <div class="grid grid-cols-4 gap-3">
        <button onclick="scrollToBooking()" class="bg-white rounded-3xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-100 hover:shadow-md transition">
            <div class="w-12 h-12 rounded-full bg-yellow-50 flex items-center justify-center">
                <img src="/assets/taxi-icon.svg" class="w-6 h-6 object-contain" alt="Taxi">
            </div>
            <div class="text-center">
                <span class="block text-[11px] font-black text-[#0f172a]">تكسي</span>
                <span class="block text-[8px] text-gray-400 font-bold mt-0.5">طلب رحلة</span>
            </div>
        </button>

        <button onclick="switchPage('market')" class="bg-white rounded-3xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-100 hover:shadow-md transition">
            <div class="w-12 h-12 rounded-full bg-purple-50 flex items-center justify-center">
                <i data-lucide="shopping-bag" class="w-5 h-5 text-purple-500"></i>
            </div>
            <div class="text-center">
                <span class="block text-[11px] font-black text-[#0f172a]">السوق</span>
                <span class="block text-[8px] text-gray-400 font-bold mt-0.5">قريباً</span>
            </div>
        </button>

        <button onclick="showToast('خدمة التوصيل قيد التجهيز.. انتظرونا قريباً 📦✨', 'success')" class="bg-white rounded-3xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-100 hover:shadow-md transition">
            <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center">
                <i data-lucide="package" class="w-5 h-5 text-blue-500"></i>
            </div>
            <div class="text-center">
                <span class="block text-[11px] font-black text-[#0f172a]">توصيل</span>
                <span class="block text-[8px] text-gray-400 font-bold mt-0.5">قريباً</span>
            </div>
        </button>

        <button onclick="switchPage('services')" class="bg-white rounded-3xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-100 hover:shadow-md transition">
            <div class="w-12 h-12 rounded-full bg-emerald-50 flex items-center justify-center">
                <i data-lucide="more-horizontal" class="w-5 h-5 text-emerald-500"></i>
            </div>
            <div class="text-center">
                <span class="block text-[11px] font-black text-[#0f172a]">المزيد</span>
                <span class="block text-[8px] text-gray-400 font-bold mt-0.5">خدمات أخرى</span>
            </div>
        </button>
    </div>

    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 relative mt-2">
        <div class="flex justify-between items-start mb-5">
            <div>
                <h3 class="text-base font-black text-[#0f172a] mb-1">إلى أين تريد الذهاب؟</h3>
                <p class="text-[10px] text-gray-400 font-bold">حدد موقع الانطلاق والوجهة</p>
            </div>
            <button class="w-8 h-8 rounded-full bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition shadow-sm">
                <i data-lucide="crosshair" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="relative space-y-3">
            <div class="absolute right-6 top-8 bottom-8 w-px border-r-2 border-dashed border-gray-200 z-0"></div>

            <div class="relative z-10 flex items-center gap-4 bg-gray-50/80 rounded-2xl p-3 border border-gray-100 cursor-pointer hover:bg-gray-100 transition" onclick="showToast('جاري تحديد موقعك...')">
                <div class="w-4 h-4 rounded-full border-[4px] border-gold-400 bg-white shadow-sm shrink-0"></div>
                <div>
                    <h4 class="text-xs font-black text-[#0f172a]">موقعي الحالي</h4>
                    <p class="text-[9px] text-gray-400 font-bold mt-0.5">سيتم تحديده تلقائياً</p>
                </div>
            </div>

            <div class="relative z-10 flex items-center gap-4 bg-white rounded-2xl p-3 border border-gray-100 shadow-sm cursor-pointer hover:border-gold-400/50 transition" onclick="scrollToBooking()">
                <i data-lucide="map-pin" class="w-5 h-5 text-[#0f172a] shrink-0 -ml-0.5"></i>
                <div>
                    <h4 class="text-xs font-black text-[#0f172a]">أين تريد الذهاب؟</h4>
                    <p class="text-[9px] text-gray-400 font-bold mt-0.5">اختر وجهتك</p>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-[#fffcf5] rounded-2xl p-3 flex items-center justify-between border border-gold-400/20 shadow-sm mt-2">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-gold-400/10 flex items-center justify-center shrink-0">
                <i data-lucide="shield-check" class="w-4 h-4 text-gold-500"></i>
            </div>
            <div>
                <h4 class="text-[11px] font-black text-[#0f172a] mb-0.5">رحلتك آمنة معنا</h4>
                <p class="text-[8px] text-gray-500 font-bold">سائقون موثوقون • متابعة الرحلة • دعم 24/7</p>
            </div>
        </div>
        <i data-lucide="chevron-left" class="w-4 h-4 text-gray-400"></i>
    </div>

</div>
