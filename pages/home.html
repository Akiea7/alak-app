<!-- pages/home.html -->
<!-- هذه هي واجهة الزبون الرئيسية (الخريطة وطلب الرحلة) -->

<div class="relative w-full h-screen">
    <!-- حاوية الخريطة (سيتم حقن خريطة جوجل هنا بواسطة mapsService.js) -->
    <div id="map" class="w-full h-full bg-gray-200"></div>

    <!-- القائمة العلوية (زر الحساب واسم التطبيق) -->
    <div class="absolute top-5 left-5 right-5 flex justify-between items-center z-10 pointer-events-none">
        <button onclick="switchPage('profile')" class="bg-white p-3 rounded-full shadow-lg pointer-events-auto active:scale-95 transition-transform">
            <i data-lucide="user" class="w-6 h-6 text-gray-700"></i>
        </button>
        <div class="bg-white px-4 py-2 rounded-full shadow-lg font-bold text-gray-800 pointer-events-auto">
            ألك 🚕
        </div>
    </div>

    <!-- البطاقة السفلية (واجهة تحديد المسار) -->
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] p-6 z-10">
        <h2 class="text-xl font-bold text-gray-800 mb-4">إلى أين نذهب؟</h2>
        
        <div class="space-y-3">
            <!-- زر اختيار موقع الانطلاق -->
            <button id="pickupBtn" class="w-full flex items-center gap-3 p-4 bg-gray-50 border border-gray-200 rounded-xl text-right active:bg-gray-100 transition-colors">
                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center shrink-0">
                    <i data-lucide="map-pin" class="w-4 h-4 text-blue-600"></i>
                </div>
                <div class="flex-1">
                    <p class="text-xs text-gray-500 mb-1">موقع الانطلاق</p>
                    <p id="pickupText" class="font-bold text-gray-800 text-sm truncate">جاري تحديد الموقع...</p>
                </div>
            </button>

            <!-- زر اختيار الوجهة -->
            <button id="destBtn" class="w-full flex items-center gap-3 p-4 bg-gray-50 border border-gray-200 rounded-xl text-right active:bg-gray-100 transition-colors">
                <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center shrink-0">
                    <i data-lucide="navigation" class="w-4 h-4 text-emerald-600"></i>
                </div>
                <div class="flex-1">
                    <p class="text-xs text-gray-500 mb-1">الوجهة</p>
                    <p id="destText" class="font-bold text-gray-800 text-sm truncate">اختر وجهتك</p>
                </div>
            </button>
        </div>

        <!-- زر تأكيد الطلب (مخفي بالبداية، يظهر فقط بعد تحديد الوجهة والانطلاق) -->
        <button id="confirmRideBtn" class="hidden w-full mt-5 bg-[#0f172a] text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
            <span>تأكيد وانطلاق</span>
            <span id="priceEstimate" class="bg-white/20 px-2 py-1 rounded-md text-sm"></span>
        </button>
    </div>
</div>
