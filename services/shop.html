<div class="relative h-64 w-[calc(100%+40px)] -mx-5 -mt-6 animate-fade-in">
    <img src="https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover" alt="Cover">
    <div class="absolute inset-0 bg-gradient-to-t from-midnight-600 via-midnight-600/60 to-transparent"></div>
    <button onclick="switchPage('market')" class="absolute top-10 right-5 w-10 h-10 glass-strong rounded-xl flex items-center justify-center hover:bg-white/10 transition border border-white/10 z-10">
        <i data-lucide="arrow-right" class="w-5 h-5 text-white"></i>
    </button>
    <button class="absolute top-10 left-5 w-10 h-10 glass-strong rounded-xl flex items-center justify-center hover:bg-white/10 transition border border-white/10 z-10 text-white/60 hover:text-white">
        <i data-lucide="heart" class="w-5 h-5"></i>
    </button>
</div>

<div class="relative z-10 animate-slide-up pb-8">
    <div class="flex items-end justify-between mb-4 -mt-14">
        <div class="w-24 h-24 rounded-2xl border-4 border-midnight-600 bg-midnight-400 flex items-center justify-center overflow-hidden shadow-2xl relative">
            <i data-lucide="crown" class="w-10 h-10 text-gold-400"></i>
        </div>
        <div class="mb-2">
            <span class="bg-gold-400/10 text-gold-400 border border-gold-400/30 px-3 py-1.5 rounded-xl text-[10px] font-bold flex items-center gap-1 shadow-lg">
                <i data-lucide="award" class="w-3.5 h-3.5"></i> متجر مميز
            </span>
        </div>
    </div>
    
    <h2 class="text-2xl font-black text-white mb-1 flex items-center gap-2">مطعم السلطان <i data-lucide="badge-check" class="w-5 h-5 text-blue-400 fill-blue-400/20"></i></h2>
    <p class="text-xs text-white/60 mb-4 font-semibold leading-relaxed">أشهى المأكولات الشرقية والغربية. نتميز باللحوم الطازجة يومياً والخدمة السريعة.</p>
    
    <div class="flex items-center gap-4 text-xs font-bold mb-6">
        <div class="flex items-center gap-1.5">
            <i data-lucide="star" class="w-4 h-4 text-gold-400 fill-gold-400"></i>
            <span class="text-white">4.8</span> <span class="text-white/40">(128 تقييم)</span>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>
            <span class="text-emerald-400">مفتوح الآن (للـ 12 ليلاً)</span>
        </div>
    </div>
    
    <div class="grid grid-cols-4 gap-3 mb-8">
        <button onclick="window.location.href='tel:+9647000000000'" class="glass-strong rounded-2xl py-3 flex flex-col items-center gap-2 border border-white/5">
            <i data-lucide="phone" class="w-5 h-5 text-gold-400"></i> <span class="text-[10px] font-bold text-white/80">اتصال</span>
        </button>
        <button onclick="window.open('https://wa.me/9647000000000')" class="glass-strong rounded-2xl py-3 flex flex-col items-center gap-2 border border-white/5">
            <i data-lucide="message-circle" class="w-5 h-5 text-emerald-400"></i> <span class="text-[10px] font-bold text-white/80">واتساب</span>
        </button>
        <button onclick="showToast('جاري فتح الخريطة...')" class="glass-strong rounded-2xl py-3 flex flex-col items-center gap-2 border border-white/5">
            <i data-lucide="map-pin" class="w-5 h-5 text-blue-400"></i> <span class="text-[10px] font-bold text-white/80">الموقع</span>
        </button>
        <button onclick="showToast('تم نسخ رابط المتجر')" class="glass-strong rounded-2xl py-3 flex flex-col items-center gap-2 border border-white/5">
            <i data-lucide="share-2" class="w-5 h-5 text-white/80"></i> <span class="text-[10px] font-bold text-white/80">مشاركة</span>
        </button>
    </div>

    <div class="space-y-4 pb-24">
        <h3 class="font-black text-lg text-white mb-3">الوجبات الرئيسية</h3>
        <div class="glass-strong rounded-3xl p-3 flex gap-4 items-center border border-white/5 shadow-lg">
            <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?q=80&w=200&auto=format&fit=crop" class="w-20 h-20 rounded-2xl object-cover shrink-0" alt="Pizza">
            <div class="flex-1 min-w-0 py-1">
                <h4 class="font-bold text-sm text-white mb-1 truncate">بيتزا بيبروني إيطالية</h4>
                <p class="text-[10px] text-white/50 mb-2 truncate">صلصة طماطم، جبن، بيبروني</p>
                <p class="font-black text-sm text-gold-400">8,500 <span class="text-[10px] text-white/60 font-semibold">د.ع</span></p>
            </div>
            <button onclick="addToCart('بيتزا بيبروني إيطالية', 8500)" class="w-10 h-10 rounded-xl bg-gold-400/10 text-gold-400 border border-gold-400/30 flex items-center justify-center shrink-0">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
        </div>
    </div>
</div>

<button id="floatingCartBtn" class="fixed bottom-28 right-5 w-14 h-14 bg-gradient-to-br from-gold-400 to-gold-600 rounded-full flex items-center justify-center shadow-[0_8px_30px_rgba(245,184,0,0.5)] z-50 transition-transform duration-300 scale-0 origin-center touch-none">
    <i data-lucide="shopping-bag" class="w-6 h-6 text-midnight-600"></i>
    <span id="cartBadge" class="absolute -top-1 -left-1 bg-red-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-black border-2 border-midnight-600 shadow-sm">0</span>
</button>
